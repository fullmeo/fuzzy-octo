<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐙💕 Pinky Poulpe Avatar</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #FF69B4, #FFB6C1, #FF1493);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .avatar-container {
            position: relative;
            width: 400px;
            height: 500px;
            margin: 20px;
        }

        .pinky-avatar {
            position: relative;
            width: 100%;
            height: 100%;
            animation: float 3s ease-in-out infinite;
        }

        /* Corps principal */
        .head {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 200px;
            background: linear-gradient(135deg, #FF69B4, #FFB6C1);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            z-index: 10;
        }

        /* Yeux expressifs */
        .eyes {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .eye {
            width: 35px;
            height: 40px;
            background: white;
            border-radius: 50%;
            position: relative;
            animation: blink 4s infinite;
        }

        .pupil {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            animation: look-around 5s infinite ease-in-out;
        }

        .sparkle-eye {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        /* Sourire intelligent */
        .smile {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            border: 4px solid white;
            border-top: none;
            border-radius: 0 0 60px 60px;
            animation: smile-pulse 3s infinite ease-in-out;
        }

        /* Cerveau visible (intelligence) */
        .brain {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4);
            border-radius: 50% 50% 40% 40%;
            opacity: 0.7;
            z-index: 5;
        }

        .brain-lines {
            position: absolute;
            top: 15px;
            left: 10px;
            width: 60px;
            height: 30px;
        }

        .brain-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 2px;
        }

        .brain-line:nth-child(1) {
            top: 5px;
            left: 10px;
            width: 20px;
            height: 2px;
            transform: rotate(15deg);
        }

        .brain-line:nth-child(2) {
            top: 12px;
            left: 25px;
            width: 15px;
            height: 2px;
            transform: rotate(-10deg);
        }

        .brain-line:nth-child(3) {
            top: 18px;
            left: 15px;
            width: 18px;
            height: 2px;
            transform: rotate(20deg);
        }

        /* Tentacules anthropomorphiques */
        .tentacles {
            position: absolute;
            top: 220px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 200px;
        }

        .tentacle {
            position: absolute;
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            border-radius: 15px;
            transform-origin: top center;
        }

        /* Tentacules comme bras/mains */
        .tentacle-1 {
            top: 20px;
            left: 20px;
            width: 25px;
            height: 120px;
            transform: rotate(-30deg);
            animation: wave-left 2s infinite ease-in-out;
        }

        .tentacle-2 {
            top: 20px;
            right: 20px;
            width: 25px;
            height: 120px;
            transform: rotate(30deg);
            animation: wave-right 2.2s infinite ease-in-out;
        }

        /* Tentacules comme jambes */
        .tentacle-3, .tentacle-4 {
            bottom: 0px;
            width: 30px;
            height: 100px;
            animation: walk 1.5s infinite ease-in-out alternate;
        }

        .tentacle-3 {
            left: 80px;
            transform: rotate(-10deg);
        }

        .tentacle-4 {
            right: 80px;
            transform: rotate(10deg);
            animation-delay: 0.75s;
        }

        /* Tentacules décoratifs */
        .tentacle-5, .tentacle-6, .tentacle-7, .tentacle-8 {
            width: 20px;
            height: 80px;
        }

        .tentacle-5 {
            top: 40px;
            left: 0px;
            transform: rotate(-45deg);
            animation: sway-1 3s infinite ease-in-out;
        }

        .tentacle-6 {
            top: 40px;
            right: 0px;
            transform: rotate(45deg);
            animation: sway-2 2.8s infinite ease-in-out;
        }

        .tentacle-7 {
            top: 80px;
            left: 10px;
            transform: rotate(-60deg);
            animation: sway-3 3.2s infinite ease-in-out;
        }

        .tentacle-8 {
            top: 80px;
            right: 10px;
            transform: rotate(60deg);
            animation: sway-4 2.9s infinite ease-in-out;
        }

        /* Accessoires intelligents */
        .glasses {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 30px;
            border: 3px solid #FFD700;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 15;
            animation: glasses-glint 4s infinite;
        }

        .glasses::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 15px;
            background: #FFD700;
        }

        /* Particules magiques */
        .sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .sparkle {
            position: absolute;
            color: #FFD700;
            font-size: 16px;
            animation: sparkle-float 3s infinite ease-in-out;
        }

        .sparkle:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .sparkle:nth-child(2) {
            top: 30%;
            right: 15%;
            animation-delay: 0.5s;
        }

        .sparkle:nth-child(3) {
            top: 60%;
            left: 5%;
            animation-delay: 1s;
        }

        .sparkle:nth-child(4) {
            top: 70%;
            right: 10%;
            animation-delay: 1.5s;
        }

        .sparkle:nth-child(5) {
            top: 10%;
            left: 50%;
            animation-delay: 2s;
        }

        /* Aura intelligente */
        .smart-aura {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 240px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2), transparent);
            border-radius: 50%;
            animation: aura-pulse 4s infinite ease-in-out;
            z-index: 1;
        }

        /* Badge $FUZZY */
        .token-badge {
            position: absolute;
            top: 40px;
            right: 30px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #333;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
            animation: badge-bounce 2s infinite ease-in-out;
            z-index: 25;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        @keyframes look-around {
            0%, 100% { transform: translateX(-50%); }
            25% { transform: translateX(-60%); }
            75% { transform: translateX(-40%); }
        }

        @keyframes smile-pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }

        @keyframes wave-left {
            0%, 100% { transform: rotate(-30deg); }
            50% { transform: rotate(-50deg); }
        }

        @keyframes wave-right {
            0%, 100% { transform: rotate(30deg); }
            50% { transform: rotate(50deg); }
        }

        @keyframes walk {
            0% { transform: rotate(-10deg) translateY(0px); }
            100% { transform: rotate(-10deg) translateY(-8px); }
        }

        @keyframes sway-1 {
            0%, 100% { transform: rotate(-45deg); }
            50% { transform: rotate(-35deg); }
        }

        @keyframes sway-2 {
            0%, 100% { transform: rotate(45deg); }
            50% { transform: rotate(35deg); }
        }

        @keyframes sway-3 {
            0%, 100% { transform: rotate(-60deg); }
            50% { transform: rotate(-50deg); }
        }

        @keyframes sway-4 {
            0%, 100% { transform: rotate(60deg); }
            50% { transform: rotate(50deg); }
        }

        @keyframes glasses-glint {
            0%, 90%, 100% { opacity: 1; }
            95% { opacity: 0.7; }
        }

        @keyframes sparkle-float {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg);
                opacity: 0.7;
            }
            50% { 
                transform: translateY(-15px) rotate(180deg);
                opacity: 1;
            }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        @keyframes aura-pulse {
            0%, 100% { 
                transform: translateX(-50%) scale(1);
                opacity: 0.3;
            }
            50% { 
                transform: translateX(-50%) scale(1.1);
                opacity: 0.5;
            }
        }

        @keyframes badge-bounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        /* Interaction hover */
        .pinky-avatar:hover .head {
            transform: translateX(-50%) scale(1.05);
        }

        .pinky-avatar:hover .glasses {
            animation: glasses-glint 0.5s;
        }

        .pinky-avatar:hover .sparkles .sparkle {
            animation-duration: 1s;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .avatar-container {
                width: 300px;
                height: 400px;
            }
            
            .head {
                width: 140px;
                height: 160px;
            }
            
            .tentacles {
                width: 240px;
                height: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="avatar-container">
        <div class="pinky-avatar">
            <!-- Aura intelligente -->
            <div class="smart-aura"></div>
            
            <!-- Badge Token -->
            <div class="token-badge">$FUZZY</div>
            
            <!-- Cerveau visible -->
            <div class="brain">
                <div class="brain-lines">
                    <div class="brain-line"></div>
                    <div class="brain-line"></div>
                    <div class="brain-line"></div>
                </div>
            </div>
            
            <!-- Tête principale -->
            <div class="head">
                <!-- Yeux expressifs -->
                <div class="eyes">
                    <div class="eye">
                        <div class="pupil"></div>
                        <div class="sparkle-eye"></div>
                    </div>
                    <div class="eye">
                        <div class="pupil"></div>
                        <div class="sparkle-eye"></div>
                    </div>
                </div>
                
                <!-- Sourire intelligent -->
                <div class="smile"></div>
            </div>
            
            <!-- Lunettes intelligentes -->
            <div class="glasses"></div>
            
            <!-- Les 8 tentacules anthropomorphiques -->
            <div class="tentacles">
                <!-- Bras/Mains -->
                <div class="tentacle tentacle-1"></div>
                <div class="tentacle tentacle-2"></div>
                
                <!-- Jambes -->
                <div class="tentacle tentacle-3"></div>
                <div class="tentacle tentacle-4"></div>
                
                <!-- Tentacules décoratifs -->
                <div class="tentacle tentacle-5"></div>
                <div class="tentacle tentacle-6"></div>
                <div class="tentacle tentacle-7"></div>
                <div class="tentacle tentacle-8"></div>
            </div>
            
            <!-- Particules magiques -->
            <div class="sparkles">
                <div class="sparkle">✨</div>
                <div class="sparkle">💫</div>
                <div class="sparkle">⭐</div>
                <div class="sparkle">✨</div>
                <div class="sparkle">💎</div>
            </div>
        </div>
    </div>

    <script>
        // Animation interactive
        const avatar = document.querySelector('.pinky-avatar');
        const eyes = document.querySelectorAll('.pupil');
        
        // Suivi du curseur avec les yeux
        document.addEventListener('mousemove', (e) => {
            const rect = avatar.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const deltaX = e.clientX - centerX;
            const deltaY = e.clientY - centerY;
            
            const angle = Math.atan2(deltaY, deltaX);
            const distance = Math.min(5, Math.sqrt(deltaX * deltaX + deltaY * deltaY) / 20);
            
            eyes.forEach(eye => {
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                eye.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${y}px)`;
            });
        });

        // Clic pour animation spéciale
        avatar.addEventListener('click', () => {
            avatar.style.animation = 'float 0.5s ease-in-out, smile-pulse 0.5s ease-in-out';
            
            // Explosion de particules
            const sparkles = document.querySelectorAll('.sparkle');
            sparkles.forEach(sparkle => {
                sparkle.style.animationDuration = '0.3s';
            });
            
            setTimeout(() => {
                avatar.style.animation = 'float 3s ease-in-out infinite';
                sparkles.forEach(sparkle => {
                    sparkle.style.animationDuration = '3s';
                });
            }, 500);
        });

        // Animation de bienvenue
        window.addEventListener('load', () => {
            avatar.style.transform = 'scale(0)';
            avatar.style.opacity = '0';
            
            setTimeout(() => {
                avatar.style.transition = 'all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                avatar.style.transform = 'scale(1)';
                avatar.style.opacity = '1';
            }, 300);
        });
    </script>
</body>
</html>
